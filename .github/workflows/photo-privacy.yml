# Fails if an image on the site carries GPS location data.
name: Photo Privacy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look for GPS metadata
        run: |
          sudo apt-get install -y -qq libimage-exiftool-perl
          found=$(exiftool -r -q -if '$GPSLatitude or $GPSPosition' -p '$Directory/$FileName' images profile.JPG || true)
          if [ -n "$found" ]; then
            echo "::error::GPS metadata found. Strip it before committing:"
            echo "$found"
            exit 1
          fi
