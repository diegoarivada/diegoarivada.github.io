name: Site Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pages match their partials and CSP config
        run: node tools/build.mjs --check
      - name: Status Worker tests
        working-directory: worker
        run: node --test
      - name: No inline scripts or styles
        run: |
          if grep -nE '<script>|<script [^>]*>[^<]+</script>|<style|style="' *.html; then
            echo "::error::Inline code found. Move it to a file so the CSP never needs 'unsafe-inline'."
            exit 1
          fi
